[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
ignore_missing_imports = False
explicit_package_bases = True
namespace_packages = True
exclude = (dashboard/|scratch/|\.venv/|artifacts/|results/)

# Ignore missing imports for specific libraries without stubs
[mypy-torch.*]
ignore_missing_imports = True

[mypy-torchvision.*]
ignore_missing_imports = True

[mypy-kaggle.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-pytorch_lightning.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-src.data.*]
warn_return_any = False
# Handle complex interop with PIL/torchvision in augmentations
disable_error_code = no-any-return, redundant-cast, union-attr, operator, assignment

[mypy-scp.*]
ignore_missing_imports = True
