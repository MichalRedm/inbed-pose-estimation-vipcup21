# Project Configuration for Loop 23: Stabilized Transfer Learning via Selective Freezing
# Focus: Stabilizing HRNet-W32 pretrained features against gradient washout.

project:
  name: inbed-pose-estimation-loop23
  seed: 42

dataset:
  root: "data/raw"
  modalities: ["IR"]
  subjects_train: [1, 80]
  subjects_val: [81, 90]
  image_size: [256, 256]

model:
  name: "hrnet"
  hrnet:
    num_joints: 14
    in_channels: 1 
    architecture: "w32"
    heatmap_size: [64, 64]
    sigma: 2.0
    pretrained: true      # Use ImageNet pretrained backbone weights
    freeze_stem: true     # Freeze first 2 conv stages (edges, basic textures)
    freeze_stage1: true   # Freeze Stage 1 (complex texture representations)

training:
  batch_size: 16
  epochs: 30
  lr: 0.00005             # Lower LR (5e-5) to avoid gradient shock to un-frozen stages
  weight_decay: 0.0001
  
  # Pure MSE Baseline (identical to Loop 2 / Loop 22)
  use_uncertainty_weighting: false
  lambda_coord: 0.0
  lambda_coord_occluded: 0.0
  decode_method: "argmax"  # Standard argmax decoding
  
  save_dir: "results/runs/loop23_stabilized_pretraining"
  augmentation:
    enabled: true
    occlusion_prob: 0.5
    flip_prob: 0.5
    rotation_range: [-30, 30]
    scaling_range: [0.8, 1.2]
