model:
  name: vitpose
  vitpose:
    pretrained: false
    pretrained_weights_path: "pretrained_models/vitpose-b-multi-coco.pth"
    num_joints: 14
    in_channels: 3

training_type: "self_training"

training:
  epochs: 60
  batch_size: 16
  lr: 0.0001
  backbone_lr_ratio: 0.05         # 1e-4 * 0.05 = 5e-6 (Stable fine-tuning)
  weight_decay: 0.0001
  sigma_start: 3.0                # Wide stable Gaussian for heavy occlusions
  sigma_end: 3.0                  # No curriculum decay to prevent peak collapse
  init_weights_path: "pretrained_models/loop53_best.pth"
  
  # Self-Training hyperparameters
  ema_alpha: 0.999                # Smoothing factor for temporal ensemble teacher
  conf_threshold_start: 0.6       # Initial keypoint peak confidence threshold
  conf_threshold_end: 0.25        # Final keypoint peak confidence threshold
  lambda_unlabeled: 1.0           # Weight of consistency regularization loss
  
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotation_range: [-30, 30]
    scaling_range: [0.8, 1.2]
    translation: [0.10, 0.10]
    exclusive_occlusion: true
    occlusion_prob: 0.25           # Thermal diffusion probability
    advanced_cover_prob: 0.4       # Programmatic cover probability
    fda_prob: 0.5                  
    hist_match_prob: 0.8           
    fda_beta: 0.01                 
    cut_prob: 0.4                  # CUT domain translation probability
    cut_path: "results/runs/loop58_cut_pose_consistent/checkpoints/latest_model.pth"
    cut_alpha_blend: true
    cut_alpha_range: [0.6, 1.0]
    cutout_prob: 0.5
    cutout_size_ratio: 0.35
    intensity_jitter_prob: 0.5
    intensity_jitter_range: [0.55, 1.15]
    contrast_jitter_range: [0.5, 1.15]
    sensor_noise_prob: 0.4
    sensor_noise_sigma: [5, 12]

dataset:
  subjects_train: [1, 80]
  subjects_val: [81, 90]
  image_size: [256, 256]
  modalities: ["IR"]
  covers: null           # For training: use all available covers (uncover, cover1, cover2)
  covers_val: ["cover1"] # Validation subjects 81-90 only have cover1 in the dataset
  dataset_root: "data/raw"
