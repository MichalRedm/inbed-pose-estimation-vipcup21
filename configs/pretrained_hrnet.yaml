# Project Configuration for HRNet with Pre-trained Weights

project:
  name: inbed-pose-estimation-pretrained
  seed: 42

dataset:
  root: "data/raw"
  modalities: ["IR"]
  subjects_train: [1, 80]
  subjects_val: [81, 90]
  image_size: [256, 256]

model:
  name: "hrnet"
  hrnet:
    num_joints: 14
    in_channels: 1 
    architecture: "w32"
    heatmap_size: [64, 64]
    sigma: 2.0
    # Enable transfer learning from ImageNet
    pretrained: true

training:
  batch_size: 16
  epochs: 30
  lr: 0.0001
  weight_decay: 0.0001
  # Uncertainty weighting for multi-task loss balance
  use_uncertainty_weighting: true
  save_dir: "results/runs/loop20_pretrained_hrnet"
  augmentation:
    enabled: true
    occlusion_prob: 0.7
    flip_prob: 0.5
    rotation_range: [-30, 30]
    scaling_range: [0.8, 1.2]
