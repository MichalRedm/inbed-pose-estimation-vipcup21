model:
  name: hrnet
  hrnet:
    pretrained: true
    architecture: w32
    num_joints: 14
    in_channels: 1                 # Student runs on single-channel IR
    heatmap_size: [64, 64]
    sigma: 2                      # default; overridden by curriculum

training_type: "distillation"      # Activate our feature distillation trainer

training:
  epochs: 40
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  sigma_start: 3.0                # Wide Gaussian at start
  sigma_end: 1.5                  # Narrow Gaussian at end
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotation_range: [-30, 30]
    scaling_range: [0.8, 1.2]
    translation: [0.10, 0.10]     # up to 10% random shift
    occlusion_prob: 0.5           # Newly refined physically realistic thermal blanket simulation
    cutout_prob: 0.5              # structured cutout for robustness against occlusion
    cutout_size_ratio: 0.35       # 35% of image dimension
    intensity_jitter_prob: 0.5    # brightness/contrast attenuation
    intensity_jitter_range: [0.55, 1.15]   # Multiplicative brightness scale
    contrast_jitter_range: [0.5, 1.15]     # Contrast compression/expansion factor
    sensor_noise_prob: 0.4        # Gaussian + salt-pepper noise
    sensor_noise_sigma: [5, 12]    # Gaussian noise sigma range

dataset:
  subjects_train: [1, 80]         # Full 80-subject training set
  subjects_val: [81, 90]          # Validate on covers 1 and 2
  image_size: [256, 256]
  return_aligned: true            # Crucial: enables loading warped RGB alongside IR

distillation:
  teacher_checkpoint: "results/runs/rgb_teacher/checkpoints/best_model.pth"
  use_uncertainty_weighting: true
  lambda_distill: 1.0             # Dynamically balanced by uncertainty weighting
