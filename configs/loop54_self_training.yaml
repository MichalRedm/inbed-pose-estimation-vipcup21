model:
  name: vitpose
  vitpose:
    pretrained: false
    pretrained_weights_path: "pretrained_models/vitpose-b-multi-coco.pth"
    num_joints: 14
    in_channels: 3

training_type: "self_training"

training:
  epochs: 40
  batch_size: 16
  lr: 0.0001
  backbone_lr_ratio: 0.05         # 1e-4 * 0.05 = 5e-6 (Stable fine-tuning)
  weight_decay: 0.0001
  sigma_start: 3.0                # Wide stable Gaussian for heavy occlusions
  sigma_end: 3.0                  # No curriculum decay to prevent peak collapse
  init_weights_path: "results/runs/loop53_fda_cover/checkpoints/best_model.pth"
  
  # Self-Training hyperparameters
  ema_alpha: 0.999                # Smoothing factor for temporal ensemble teacher
  confidence_threshold: 0.35      # Keypoint peak confidence threshold to filter pseudo-labels
  lambda_unlabeled: 1.0           # Weight of consistency regularization loss
  
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotation_range: [-30, 30]
    scaling_range: [0.8, 1.2]
    translation: [0.10, 0.10]
    occlusion_prob: 0.25           # Reduced to balance with advanced cover
    advanced_cover_prob: 0.4       # FDA + Histogram Matching for labeled examples
    fda_prob: 0.5                  
    hist_match_prob: 0.8           
    fda_beta: 0.01                 
    cutout_prob: 0.5
    cutout_size_ratio: 0.35
    intensity_jitter_prob: 0.5
    intensity_jitter_range: [0.55, 1.15]
    contrast_jitter_range: [0.5, 1.15]
    sensor_noise_prob: 0.4
    sensor_noise_sigma: [5, 12]

dataset:
  subjects_train: [1, 80]
  subjects_val: [81, 90]
  image_size: [256, 256]
  dataset_root: "data/SLP"
