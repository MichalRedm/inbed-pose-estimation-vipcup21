# Project Configuration for Loop 24: Discriminative Learning Rates for Unfrozen Pre-training
# Focus: Allowing pretrained HRNet backbone weights to adapt to IR pose estimation using layered learning rates.

project:
  name: inbed-pose-estimation-loop24
  seed: 42

dataset:
  root: "data/raw"
  modalities: ["IR"]
  subjects_train: [1, 30]       # Rigorous control mirroring the Loop 2 scratch baseline
  subjects_val: [81, 90]
  image_size: [256, 256]

model:
  name: "hrnet"
  hrnet:
    num_joints: 14
    in_channels: 1 
    architecture: "w32"
    heatmap_size: [64, 64]
    sigma: 2.0
    pretrained: true      # Load ImageNet pretrained backbone weights
    freeze_stem: false    # Fully unfrozen stem
    freeze_stage1: false  # Fully unfrozen stage 1

training:
  batch_size: 16
  epochs: 30
  lr: 0.0001              # Full head learning rate (1e-4)
  backbone_lr_ratio: 0.1  # Backbone fine-tunes gently at 0.1x head LR (1e-5)
  weight_decay: 0.0001
  
  # Standard MSE Heatmap Setup (identical to Loop 2 / Loop 22 / Loop 23)
  use_uncertainty_weighting: false
  lambda_coord: 0.0
  lambda_coord_occluded: 0.0
  decode_method: "argmax"  # Argmax decoding for maximum spatial precision
  
  save_dir: "results/runs/loop24_unfrozen_pretraining"
  augmentation:
    enabled: true
    occlusion_prob: 0.5
    flip_prob: 0.5
    rotation_range: [-30, 30]
    scaling_range: [0.8, 1.2]
