# Project Configuration

project:
  name: inbed-pose-estimation
  seed: 42

dataset:
  root: "data/raw"
  kaggle_slug: "awsaf49/ieee-vip-cup-2021-train-val-dataset"
  modalities: ["RGB", "IR"]
  num_subjects_train: 30
  num_subjects_total: 70
  temperature_range: [20, 40]
  image_size: [256, 256]

model:
  name: "hrnet"
  hrnet:
    num_joints: 14
    in_channels: 3 
    architecture: "w32"
    heatmap_size: [64, 64]
    sigma: 2.0

training:
  batch_size: 16
  epochs: 100
  lr: 0.0001
  weight_decay: 0.0001
  save_dir: "models/checkpoints"

remote:
  use_remote: false
  backend: "kaggle"
  data_root: "/kaggle/input/inbed-pose-estimation-vipcup21/data/raw"
